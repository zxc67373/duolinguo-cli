[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duolinguo-cli"
version = "0.1.0"
description = "多邻国风格的命令行背单词工具 — 闯关 + 间隔重复，中文界面"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "BAIGUANGMEI" }]
keywords = ["vocabulary", "cli", "spaced-repetition", "背单词", "duolingo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/BAIGUANGMEI/duolinguo-cli"

[project.scripts]
duolinguo = "duolinguo_cli.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["duolinguo_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
